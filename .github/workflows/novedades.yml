name: Actualizar novedades del Digesto

# Corre todos los días, cada vez que se sube una ordenanza nueva a novedades/ordenanzas/
# y también a mano desde la pestaña Actions («Run workflow»).
on:
  schedule:
    - cron: '17 10 * * *'   # 07:17 hora de Buenos Aires
  push:
    branches: [main]
    paths:
      - 'novedades/ordenanzas/**'
      - 'novedades/relaciones.json'
      - 'herramientas/actualizar_novedades.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novedades
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leer ordenanzas nuevas y consultar el Boletín Oficial Municipal
        run: python herramientas/actualizar_novedades.py
      - name: Publicar si hubo cambios
        run: |
          git config user.name  "Digesto Gilense (automático)"
          git config user.email "actions@users.noreply.github.com"
          git add digesto-novedades.js novedades/estado-sibom.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Novedades: actualización automática $(date -u +%Y-%m-%d)"
            git push
          fi
